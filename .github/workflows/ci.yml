name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --all

      - name: Smoke test binary
        shell: bash
        run: |
          BIN=target/release/rdl
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/release/rdl.exe; fi
          "$BIN" --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rdl-${{ runner.os }}-${{ runner.arch }}
          path: target/release/rdl${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
