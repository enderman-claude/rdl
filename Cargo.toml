[package]
name = "rdl"
version = "0.1.0"
edition = "2021"
description = "Fast single-file downloader with parallel range requests and browser-like presets"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
indicatif = "0.17"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
